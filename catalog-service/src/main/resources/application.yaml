spring:
  application:
    name: catalog-service
  datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:15432/postgres}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false


catalog:
  pageNo: 10


server:
  port: 8000
  shutdown: graceful


management:
  endpoints:
    web:
      exposure:
        include: "*"



